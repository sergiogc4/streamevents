{% extends "base.html" %}
{% block content %}
<h2>Perfil Públic de {{ public_user.username }}</h2>
<p><strong>Nom complet:</strong> {{ public_user.first_name }} {{ public_user.last_name }}</p>
<p><strong>Bio:</strong> {{ public_user.bio }}</p>
{% if public_user.avatar %}
<img src="{{ public_user.avatar.url }}" width="120" class="rounded-circle">
{% endif %}
{% endblock %}
